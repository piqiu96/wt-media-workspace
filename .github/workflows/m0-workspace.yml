name: M0 Workspace Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run workspace tests
        run: python -m unittest discover -s tests

      - name: Verify skills
        run: python scripts/verify_skills.py

      - name: Verify M0 config
        run: python scripts/verify_m0_config.py --allow-missing-repos
