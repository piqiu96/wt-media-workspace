name: M0 Workspace Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run workspace tests
        run: python -m unittest discover -s tests

      - name: Verify skills
        run: python scripts/verify_skills.py

      - name: Verify M0 config
        run: python scripts/verify_m0_config.py --allow-missing-repos

      - name: Verify product and Master Plan alignment
        run: python scripts/verify_product_master_alignment.py

      - name: Validate active AI workspace context
        run: |
          ACTIVE_CHANGE="$(python - <<'PY'
          from pathlib import Path
          changes = sorted(path.parent.name for path in Path("delivery/active").glob("*/change.md"))
          if len(changes) != 1:
              raise SystemExit(f"expected exactly one active CHG, found {changes}")
          print(changes[0])
          PY
          )"
          python scripts/prepare_ai_workspace.py --change "$ACTIVE_CHANGE" --no-write
