schema_version: 1
planning_note: "Verified releases are historical scope evidence; revised milestone completion is determined by the current Master Plan and latest comprehensive acceptance."

toolchains:
  cloud:
    ci_go_version: "1.26.5"
    local_outer_go_bin: "../devenv/go26/go/bin/go"
    local_outer_goroot: "../devenv/go26/go"
    local_outer_gopath: "../devenv/go19/gopath"
    bare_go_status: "Codex shell currently resolves bare go to devenv/go19; use local_outer_go_bin for M0 verification."
  agent:
    ci_python_version: "3.12"
    local_observed_python: "3.9.6"
    package_requires_python: ">=3.12"
    local_note: "M0 direct unittest passes on system Python 3.9.6; CI is the formal Python 3.12 check."
  desktop:
    ci_node_version: "26"
    local_observed_node: "26.5.0"
    local_observed_npm: "11.17.0"
    ci_rust_toolchain: stable
    local_observed_rustc: "1.97.0"
    local_observed_cargo: "1.97.0"
    rust_status: "M0-R4 verified real Vue/Vite/Tauri Rust test/build/start/health/stop loop; M1 still requires mock-free Desktop/Local Agent integration."

