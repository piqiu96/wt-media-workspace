schema_version: 1
contract_state: m2_sensitive_profile_guard
formal_definitions_active: true

contracts:
  cloud_api:
    owner: wt-media-cloud
    path: ../wt-media-cloud/contracts/cloud-api
    state: active
    formal_definition: active
    api_major_version: v1
    # 2026.09.06.1 → 2026.10.02.1：cloud-api 的 v1/file-transfer.openapi.yaml
    # 已由 cloud 仓推进（该值此前与定义脱节，由 verify_m0_config 的活源对比抓出）。
    # 2026.10.23.1：登录改为只认 user_sessions、BitBrowser 绑定走 Agent Token、
    # Profile 双作用域；identity 与 browser-profiles 一并推进。
    # 2026.10.26.1：content-production 增加策略/任务/成片 operator_id 与负责人
    # 目录 /compose-operators；历史行不回填。
    # 2026.10.26.2：素材库改为团队授权、游戏只做筛选；列表增加加入/我的使用/
    # 团队使用三个维度的筛选与投影，下载只允许从当前用户有效「我的素材」发起。
    # 2026.10.27.1：成片列表增加 game_id（只收窄，普通运营越界 403）；
    # 执行结果不明确的核对从「仅管理员」放宽为管理员或同团队高级运营。
    # 2026.10.27.2：自动选材改为策略团队素材池；新增
    # GET /compose-strategies/{id}/runs/tasks 的 ComposeBatchView/ComposeBatchCounts，
    # 无 run 返回 404；任务与成片 material_usage_id 允许 null。
    # 2026.10.27.3：media-accounts 的 Platform 枚举把 baijiahao 改为 baidu
    # （CHG-20261015-098 第三轮平台标识统一，见 ADR-0024）。
    # 2026.10.27.4：content-production 的素材读取说明补上创建人
    # （created_by / created_by_name）。
    contract_revision: "2026.10.27.4"
    consumers:
      - wt-media-cloud/web
      - wt-media-desktop
  cloud_agent_api:
    owner: wt-media-cloud
    path: ../wt-media-cloud/contracts/cloud-agent-api
    state: active
    formal_definition: active
    api_major_version: v1
    # 2026.10.13.1：v1/file-transfer.openapi.yaml 已推进（map 停在 2026.10.01.1，
    # 由活源对比抓出）。
    # 2026.10.23.1：Agent Token、统一 Preflight、attempt 上报与 permit 互斥取代
    # 节点凭证与无认证 claim/report；minimum 同步抬高，旧 Agent 失败关闭。
    contract_revision: "2026.10.23.1"
    minimum_agent_contract_revision: "2026.10.23.1"
    compatibility_endpoint: /api/v1/cloud-agent/compatibility
    consumers:
      - wt-media-agent
  business_schemas:
    owner: wt-media-cloud
    path: ../wt-media-cloud/contracts/business-schemas
    state: active
    formal_definition: active
    # 2026.07.14.4 → 2026.10.02.1：三个定义文件早已推进（identity/browser-profile/
    # media-account），map 停在旧值上无人可见，由活源对比抓出。
    # 2026.10.23.1：UserSession/BitAccountView（掩码）与 FileTransferTask.claimed_by。
    # 2026.10.26.1：Material 增加查看者关系（usage_status/added_at）、我的使用
    # （my_usage）与团队成功成片汇总（usage）；历史无负责人的成片只计总数。
    # 2026.10.27.1：ComposeSchedule.material_scope 增加 team_materials（当前
    # 执行语义）；creator_usages 保留为历史持久值，旧 schedule_json 不重写。
    # 2026.10.27.2：MediaAccount.platform 枚举改为 baidu。
    # 2026.10.27.3：Material 增加素材操作人 created_by（必填）与
    # created_by_name（解析不到时不出现），三种角色都读。
    schema_revision: "2026.10.27.3"
    consumers:
      - wt-media-cloud/web
      - wt-media-agent
      - wt-media-desktop
  task_schemas:
    owner: wt-media-cloud
    path: ../wt-media-cloud/contracts/task-schemas
    state: active
    formal_definition: active
    # 2026.10.23.1：Task 增加 user/attempt/last_report_at/settled_by 等运行字段，
    # 去掉设备/节点，并按任务类型给出静默超时与外部副作用默认值。
    schema_revision: "2026.10.23.1"
    consumers:
      - wt-media-agent
      - wt-media-desktop
  business_enums:
    owner: wt-media-cloud
    path: ../wt-media-cloud/contracts/business-enums
    state: active
    formal_definition: active
    # 2026.07.14.3 → 2026.09.26.2：identity.yaml（2026.07.22.1）与
    # content-production.yaml（2026.09.26.2，CHG-20260930-069）已推进。
    # 2026.10.23.1：identity 增加 client_type 与 invalidated_reason。
    # 2026.10.27.1：media-account 的 platforms 枚举改为 baidu。
    enum_revision: "2026.10.27.1"
    consumers:
      - wt-media-cloud/web
      - wt-media-agent
      - wt-media-desktop
  cloud_error_codes:
    owner: wt-media-cloud
    path: ../wt-media-cloud/contracts/cloud-error-codes
    state: active
    formal_definition: active
    # 2026.07.14.5 → 2026.10.02.1：agent-runtime/browser-profile/profile-guard
    # 三个错误码文件已推进，map 停在旧值，由活源对比抓出。
    # 2026.10.23.1：会话/Agent Token/BitBrowser 绑定/统一 Preflight 的错误码重写，
    # 新增 v1/execution.yaml；节点凭证与 permit credential 的错误码删除。
    # 2026.10.26.1：content-production 补登记 compose_task_not_retryable（409）；
    # 该错误码自 CHG-20261026-103 起已由服务返回，此前只存在于 OpenAPI 描述。
    error_revision: "2026.10.26.1"
    consumers:
      - wt-media-cloud/web
      - wt-media-agent
      - wt-media-desktop
  local_agent_api:
    owner: wt-media-agent
    path: ../wt-media-agent/contracts/local-agent-api
    state: active
    formal_definition: active
    api_major_version: v1
    # CHG-20260924-061 T-04 added GET/POST /api/v1/save-directory, which moves the
    # definition to 2026.09.27.1. This line was already stale before that change:
    # it read 2026.09.06.1 while the definition said 2026.09.24.1, and the stale
    # pair passed everything, because the only check that pins this value compares
    # it to a constant in scripts/verify/verify_m0_config.py -- never to the definition
    # file sitting beside it. CHG-20260923-059 T-09 measured that drift and
    # CHG-20260925-063 T-01 then moved that constant onto the stale value.
    # CHG-20261002-074 added the optional `scan` parameter to GET /api/v1/status,
    # which moves the definition to 2026.10.03.1, and synced that constant as well.
    # 2026.10.23.1：新增 Agent Token 交接、BitBrowser 绑定、敏感任务预检与许可
    # 交还、Profile CRUD 与 Cookie 读取；扫描带 observed_at。
    # 2026.10.27.1：AccountCheckRequest.platform 枚举改为 baidu。
    contract_revision: "2026.10.27.1"
    consumers:
      - wt-media-desktop
  local_event_schemas:
    owner: wt-media-agent
    path: ../wt-media-agent/contracts/local-event-schemas
    state: active
    formal_definition: active
    event_revision: "2026.07.14.9"
    consumers:
      - wt-media-desktop
  local_status_enums:
    owner: wt-media-agent
    path: ../wt-media-agent/contracts/local-status-enums
    state: active
    formal_definition: active
    enum_revision: "2026.07.14.8"
    consumers:
      - wt-media-desktop
  local_error_codes:
    owner: wt-media-agent
    path: ../wt-media-agent/contracts/local-error-codes
    state: active
    formal_definition: active
    # The newest of the area's definitions, as `local_event_schemas` does: the
    # files carry their own revisions. CHG-20261023-101 advanced both
    # `v1/bitbrowser.yaml` (offline / Cloud-unreachable refusals, secret policy)
    # and `v1/transfer.yaml` (save-directory and Agent Token refusals).
    error_revision: "2026.10.23.1"
    consumers:
      - wt-media-desktop
